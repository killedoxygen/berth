name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: cross-build
        if: matrix.os == 'ubuntu-latest'
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/berth
          done
      - name: shellcheck install.sh
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck install.sh
  onboarding:
    # The real install path: setup (launchd on macOS; on Linux runners without a
    # user manager, the no-service-manager fallback), a run, a background job, uninstall.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/berth" ./cmd/berth
      - name: setup
        run: '"$RUNNER_TEMP/berth" setup --no-path'
      - name: use
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          berth doctor || true
          set +e
          berth run -- sh -c 'echo hello from a berth job; exit 3'
          code=$?
          set -e
          test "$code" = 3
          id=$(berth submit --name ci -- sh -c 'echo queued output')
          test "$(berth wait "$id")" = "queued output"
          berth status --all
      - name: uninstall
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          berth uninstall --purge
          ! berth status 2>/dev/null
